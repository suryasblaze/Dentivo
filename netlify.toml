[build]
  command = "npm run build"
  publish = "dist"

# Client-side routing: every path must serve index.html,
# or refreshing /intake or /patients/xyz returns 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
